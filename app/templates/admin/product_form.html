{% extends 'base.html' %}{% block title %}{{title}} | CRV{% endblock %}{% block content %}<section class="section admin narrow"><a class="back" href="{{url_for('admin.dashboard')}}">← Dashboard</a><label>CATALOGUE CONTROL</label><h1>{{title}}</h1><form class="admin-form" method="post" enctype="multipart/form-data"><input name="name" placeholder="Product name" value="{{product.name if product else ''}}" required><div class="form-row"><input type="number" step="0.01" name="price" placeholder="Price" value="{{product.price if product else ''}}" required><input name="currency" placeholder="Currency" value="{{product.currency if product else '$'}}"><input name="unit" placeholder="Unit e.g. 5KG" value="{{product.unit if product else ''}}"></div><input name="category" placeholder="Category" value="{{product.category if product else ''}}"><textarea name="description" placeholder="Description">{{product.description if product else ''}}</textarea><textarea name="specifications" placeholder="Specifications">{{product.specifications if product else ''}}</textarea><select name="availability"><option {{'selected' if product and product.availability=='Available'}}>Available</option><option {{'selected' if product and product.availability=='Out of Stock'}}>Out of Stock</option><option {{'selected' if product and product.availability=='Contact Us'}}>Contact Us</option></select><input type="file" name="image" accept=".jpg,.jpeg,.png,.webp"><label><input type="checkbox" name="featured" {{'checked' if product and product.featured}}> Mark as featured</label><button class="btn orange big">Save product</button></form></section>{% endblock %}
