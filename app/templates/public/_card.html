<article class="card reveal">
  <a class="pic" href="{{ url_for('public.detail', product_id=product.id) }}">
    {% if product.image %}
      <img loading="lazy"
           src="{{ url_for('static', filename=product.image) }}"
           alt="{{ product.name }}"
           onerror="this.onerror=null;this.style.display='none';this.parentElement.classList.add('image-missing');this.nextElementSibling.style.display='grid';">
      <div class="placeholder" style="display:none">{{ product.name[0] }}</div>
    {% else %}
      <div class="placeholder">{{ product.name[0] }}</div>
    {% endif %}
    <span>{{ product.availability }}</span>
  </a>
  <div class="body">
    <small>{{ product.category }} · {{ product.unit }}</small>
    <h3>{{ product.name }}</h3>
    <strong>{{ product.price_display }}</strong><em>listed price</em>
    <div>
      <a class="btn dark" href="{{ url_for('public.detail', product_id=product.id) }}">View details</a>
      <a class="btn green js-wa" data-name="{{ product.name }}" data-price="{{ product.price_display }}" data-unit="{{ product.unit }}" href="#">Order ↗</a>
    </div>
  </div>
</article>
